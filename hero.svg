<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="700" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="4" fill="#7c8cff"/>

  <text x="64" y="96" fill="#e6edf3" font-size="46" font-weight="700">linear-orchestrator</text>
  <text x="64" y="140" fill="#8b949e" font-size="23">Tickets in. Reviewed pull requests out. Nobody watching.</text>
  <text x="64" y="176" fill="#6e7681" font-size="17">A Claude Code skill that runs your board overnight — and hands the morning back to you.</text>

  <!-- flow band -->
  <g>
    <!-- 1 -->
    <rect x="64" y="236" width="196" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="84" y="270" fill="#7c8cff" font-size="13" font-weight="700" letter-spacing="1">YOU</text>
    <text x="84" y="298" fill="#e6edf3" font-size="19" font-weight="600">Write a ticket</text>
    <text x="84" y="322" fill="#8b949e" font-size="15">Linear · Todo column</text>
    <polygon points="270,288 288,282 288,294" fill="#484f58"/>

    <!-- 2 -->
    <rect x="298" y="236" width="196" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="318" y="270" fill="#3fb950" font-size="13" font-weight="700" letter-spacing="1">GATE</text>
    <text x="318" y="298" fill="#e6edf3" font-size="19" font-weight="600">Blocks, free</text>
    <text x="318" y="322" fill="#8b949e" font-size="15">Pure shell. No tokens.</text>
    <polygon points="504,288 522,282 522,294" fill="#484f58"/>

    <!-- 3 -->
    <rect x="532" y="236" width="196" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="552" y="270" fill="#d29922" font-size="13" font-weight="700" letter-spacing="1">N AGENTS</text>
    <text x="552" y="298" fill="#e6edf3" font-size="19" font-weight="600">Write the code</text>
    <text x="552" y="322" fill="#8b949e" font-size="15">One per 2.5 GB free</text>
    <polygon points="738,288 756,282 756,294" fill="#484f58"/>

    <!-- 4 -->
    <rect x="766" y="236" width="196" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="786" y="270" fill="#d29922" font-size="13" font-weight="700" letter-spacing="1">FRESH AGENT</text>
    <text x="786" y="298" fill="#e6edf3" font-size="19" font-weight="600">Reviews it cold</text>
    <text x="786" y="322" fill="#8b949e" font-size="15">Then fixes what it found</text>
    <polygon points="972,288 990,282 990,294" fill="#484f58"/>

    <!-- 5 -->
    <rect x="1000" y="236" width="216" height="104" rx="10" fill="#161b22" stroke="#7c8cff"/>
    <text x="1020" y="270" fill="#7c8cff" font-size="13" font-weight="700" letter-spacing="1">YOUR MORNING</text>
    <text x="1020" y="298" fill="#e6edf3" font-size="19" font-weight="600">A PR to read</text>
    <text x="1020" y="322" fill="#8b949e" font-size="15">Not a chat to catch up on</text>
  </g>

  <!-- feedback loop -->
  <path d="M1108 350 L1108 400 L396 400 L396 352" fill="none" stroke="#484f58" stroke-dasharray="5 5"/>
  <polygon points="396,336 390,354 402,354" fill="#484f58"/>
  <text x="640" y="392" fill="#8b949e" font-size="16">A comment on the PR is the whole steering wheel — open or already merged</text>

  <!-- value props -->
  <g>
    <rect x="64" y="470" width="368" height="164" rx="10" fill="#0f141a" stroke="#21262d"/>
    <text x="92" y="516" fill="#e6edf3" font-size="21" font-weight="600">No chats to babysit</text>
    <text x="92" y="552" fill="#8b949e" font-size="16">You never open an agent window.</text>
    <text x="92" y="578" fill="#8b949e" font-size="16">Make a ticket, read the PR, comment</text>
    <text x="92" y="604" fill="#8b949e" font-size="16">to steer it. That is the whole loop.</text>

    <rect x="456" y="470" width="368" height="164" rx="10" fill="#0f141a" stroke="#21262d"/>
    <text x="484" y="516" fill="#e6edf3" font-size="21" font-weight="600">Every spare gigabyte, 24/7</text>
    <text x="484" y="552" fill="#8b949e" font-size="16">It measures the machine every</text>
    <text x="484" y="578" fill="#8b949e" font-size="16">minute and runs the most work it</text>
    <text x="484" y="604" fill="#8b949e" font-size="16">can hold — then waits for nothing.</text>

    <rect x="848" y="470" width="368" height="164" rx="10" fill="#0f141a" stroke="#21262d"/>
    <text x="876" y="516" fill="#e6edf3" font-size="21" font-weight="600">Only the context you need</text>
    <text x="876" y="552" fill="#8b949e" font-size="16">Every judgment call, the evidence</text>
    <text x="876" y="578" fill="#8b949e" font-size="16">behind it and the screenshots land</text>
    <text x="876" y="604" fill="#8b949e" font-size="16">on the PR. Nothing else to read.</text>
  </g>

  <text x="64" y="676" fill="#484f58" font-size="15">Never merges · never pushes to your base branch · never writes to production</text>
</svg>
